name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Focused native verification remains available when the WASIX installer
  # or external runtime distribution is temporarily unavailable.
  native-core:
    name: Native accounting and engine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Test accounting and engine
        run: cargo test --locked -p bunting-ledger -p bunting-engine
      - name: Test application and wire contracts
        run: cargo test --locked -p bunting-api-contract -p simfix-mapping -p bunting-application
      - name: Test durable native origin and adapter parity
        run: cargo test --locked -p bunting-server --test path_equivalence
      - name: Verify formatting
        run: cargo fmt --all --check
      - name: Compile application and transport adapters
        run: cargo check --locked -p bunting-application -p bunting-server -p quarcc-bunting-adapter
      - name: Clippy on affected crates
        run: cargo clippy --locked -p bunting-ledger -p bunting-engine -p bunting-api-contract -p simfix-mapping -p bunting-application --all-targets -- -D warnings

  rust-kernel:
    name: Rust kernel and WASI venue
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install pinned Rust toolchain
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown

      # cargo-wasix v0.1.28 installs with Cargo on PATH; its locked
      # transitive dependencies require a newer bootstrap compiler than
      # the repository's intentionally pinned 1.88 source toolchain.
      - name: Install cargo-wasix bootstrap Rust
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Install pinned WASIX toolchain
        uses: wasix-org/cargo-wasix@v0.1.28
        env:
          RUSTUP_TOOLCHAIN: "1.96.0"
        with:
          version: "0.1.28"
          toolchain-version: "v2026-07-07.3+rust-1.96"
          locked: "true"

      - name: Install pinned Wasmer runtime
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://get.wasmer.io |
            sh -s "v7.2.1"
          test -x "$HOME/.wasmer/bin/wasmer"
          "$HOME/.wasmer/bin/wasmer" --version
          echo "$HOME/.wasmer/bin" >> "$GITHUB_PATH"

      - name: Enforce architecture dependency policy
        run: |
          test -f Cargo.lock
          ! cargo tree --locked -p bunting-engine -e normal | grep -q 'orderbook-rs'
          ! cargo tree --locked -p bunting-engine | grep -q '^worker '
          cargo check --locked -p bunting-engine --target wasm32-unknown-unknown
          ! cargo tree --locked | grep -q '^worker '

      - name: Check formatting
        run: |
          cargo fmt --all --check
          python3 tools/generate_protocol.py
          git diff --exit-code -- PROTOCOL.md

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run unit tests
        run: cargo test --locked --workspace

      # WASIX's compiler links host-side build scripts through GCC with
      # -fuse-ld=lld. Ensure both the linker driver and binutils are present;
      # ordinary host cargo test does not exercise this cross-build path.
      - name: Install native linkers for WASIX host build scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils lld
          command -v ld
          command -v ld.lld

      - name: Install Go for external FIX interoperability
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: tests/interop/quickfixgo/go.sum

      - name: Run QuickFIX-Go FIXT.1.1 and FIX 5.0 SP2 interop
        env:
          BUNTING_SERVER_ARTIFACT: ${{ github.workspace }}/target/wasm32-wasmer-wasi-dl/release/bunting-server.wasmu
          WASMER_BIN: /home/runner/.wasmer/bin/wasmer
        run: |
          tools/build_wasi_server.sh
          cd tests/interop/quickfixgo
          go test -count=1 .

      - name: Smoke Wasmer-hosted WASI server
        run: |
          set -euo pipefail
          BUNTING_SERVER_ARTIFACT="$GITHUB_WORKSPACE/target/wasm32-wasmer-wasi-dl/release/bunting-server.wasmu" \
            tools/run_wasi_server.py apps/bunting-server/config/local.json \
            > /tmp/bunting-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8080/health > /tmp/bunting-health.json; then
              break
            fi
            sleep 0.25
          done
          grep -Fq '"status":"ok"' /tmp/bunting-health.json
          curl --fail --silent \
            -H 'Authorization: Bearer replace-admin-token' \
            http://127.0.0.1:8080/admin/runs/1 > /tmp/bunting-run.json
          grep -Fq '"runId":"1"' /tmp/bunting-run.json

      - name: Enforce replay and onboarding budget
        run: |
          set -euo pipefail
          started=$(date +%s)
          cargo run --locked -q -p bunting-rs --example competition_archive > /tmp/competition.archive.json
          cargo run --locked -q -p bunting-cli -- replay /tmp/competition.archive.json
          cargo run --locked -q -p bunting-cli -- score /tmp/competition.archive.json > /tmp/competition.score.json
          test $(( $(date +%s) - started )) -le 120

      - name: Verify the matcher oracle is test-only
        run: "! cargo tree --locked -p bunting-engine -e normal | grep -q 'orderbook-rs'"
