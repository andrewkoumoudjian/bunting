name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Focused native verification remains available when the WASIX installer
  # or external runtime distribution is temporarily unavailable.
  native-core:
    name: Native accounting and engine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Test accounting and engine
        run: cargo test --locked -p bunting-ledger -p bunting-engine
      - name: Test application and wire contracts
        run: cargo test --locked -p bunting-api-contract -p simfix-mapping -p bunting-application
      - name: Test durable native origin and adapter parity
        run: cargo test --locked -p bunting-server --test path_equivalence
      - name: Verify formatting
        run: cargo fmt --all --check
      - name: Compile application and transport adapters
        run: cargo check --locked -p bunting-application -p bunting-server -p quarcc-bunting-adapter
      - name: Clippy on affected crates
        run: cargo clippy --locked -p bunting-ledger -p bunting-engine -p bunting-api-contract -p simfix-mapping -p bunting-application --all-targets -- -D warnings

  rust-kernel:
    name: Rust kernel and native venue
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install pinned Rust toolchain
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown

      - name: Enforce architecture dependency policy
        run: |
          test -f Cargo.lock
          ! cargo tree --locked -p bunting-engine -e normal | grep -q 'orderbook-rs'
          ! cargo tree --locked -p bunting-engine | grep -q '^worker '
          cargo check --locked -p bunting-engine --target wasm32-unknown-unknown
          ! cargo tree --locked | grep -q '^worker '

      - name: Check formatting
        run: |
          cargo fmt --all --check
          python3 tools/generate_protocol.py
          git diff --exit-code -- PROTOCOL.md

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run unit tests
        run: cargo test --locked --workspace

      - name: Build native release server
        run: cargo build --locked --release -p bunting-server -p bunting-cli

      - name: Install Go for external FIX interoperability
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: tests/interop/quickfixgo/go.sum

      - name: Run QuickFIX-Go FIXT.1.1 and FIX 5.0 SP2 interop
        env:
          BUNTING_SERVER_BIN: ${{ github.workspace }}/target/release/bunting-server
        run: |
          cd tests/interop/quickfixgo
          go test -count=1 .

      # ADR 0044: durable origin, built-in agents, FIX order flow, restart.
      - name: Smoke native venue
        run: python3 tools/smoke_server.py --state-dir "$RUNNER_TEMP/smoke" -- target/release/bunting server

      - name: Enforce replay and onboarding budget
        run: |
          set -euo pipefail
          started=$(date +%s)
          cargo run --locked -q -p bunting-rs --example competition_archive > /tmp/competition.archive.json
          cargo run --locked -q -p bunting-cli -- replay /tmp/competition.archive.json
          cargo run --locked -q -p bunting-cli -- score /tmp/competition.archive.json > /tmp/competition.score.json
          test $(( $(date +%s) - started )) -le 120

      - name: Verify the matcher oracle is test-only
        run: "! cargo tree --locked -p bunting-engine -e normal | grep -q 'orderbook-rs'"

  # ADR 0044: the release platforms run a durable venue, not just compile.
  portable:
    name: Native venue on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup show
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build native release server
        shell: bash
        run: cargo build --locked --release -p bunting-server -p bunting-cli
      - name: Clippy server and CLI
        shell: bash
        run: cargo clippy --locked -p bunting-server -p bunting-cli -- -D warnings
      - name: Smoke native venue
        shell: bash
        run: python tools/smoke_server.py --state-dir "$RUNNER_TEMP/smoke" -- target/release/bunting server

  container:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Build image
        run: docker build -f apps/bunting-server/Dockerfile -t bunting:ci .
      - name: Smoke image
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/container-smoke"
          mkdir -p "$state"
          python3 tools/smoke_server.py --state-dir "$state" \
            --config-path /etc/bunting/server.json \
            --storage-path /var/lib/bunting/origin.json -- \
            docker run --rm --init --network host \
              -v "$state:/etc/bunting:ro" -v bunting-ci-state:/var/lib/bunting \
              bunting:ci server
