name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-kernel:
    name: Rust and Worker kernel
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install pinned Rust toolchain
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown

      - name: Install pinned WASIX toolchain
        uses: wasix-org/cargo-wasix@v0.1.28
        with:
          version: "0.1.28"
          toolchain-version: "v2026-07-07.3+rust-1.96"
          locked: "true"

      - name: Install pinned Wasmer runtime
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://get.wasmer.io |
            sh -s "v 7.2.1"
          echo "$HOME/.wasmer/bin" >> "$GITHUB_PATH"

      - name: Enforce architecture dependency policy
        run: |
          test -f Cargo.lock
          grep -Fq 'orderbook-rs = { version = "=0.10.3", default-features = false }' Cargo.toml
          cargo tree --locked -p bunting-engine | grep -F 'orderbook-rs v0.10.3'
          ! cargo tree --locked -p bunting-engine | grep -q '^worker '
          cargo check --locked -p bunting-engine --target wasm32-unknown-unknown
          ! cargo tree --locked | grep -q '^worker '

      - name: Check formatting
        run: |
          cargo fmt --all --check
          python3 tools/generate_protocol.py
          git diff --exit-code -- PROTOCOL.md

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run unit tests
        run: cargo test --locked --workspace

      - name: Install Go for external FIX interoperability
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: tests/interop/quickfixgo/go.sum

      - name: Run QuickFIX-Go FIXT.1.1 and FIX 5.0 SP2 interop
        env:
          BUNTING_SERVER_ARTIFACT: ${{ github.workspace }}/target/wasm32-wasmer-wasi-dl/release/bunting-server.wasmu
          WASMER_BIN: /home/runner/.wasmer/bin/wasmer
        run: |
          tools/build_wasi_server.sh
          cd tests/interop/quickfixgo
          go test -count=1 .

      - name: Smoke Wasmer-hosted WASI server
        run: |
          set -euo pipefail
          BUNTING_SERVER_ARTIFACT="$GITHUB_WORKSPACE/target/wasm32-wasmer-wasi-dl/release/bunting-server.wasmu" \
            tools/run_wasi_server.py apps/bunting-server/config/local.json \
            > /tmp/bunting-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8080/health > /tmp/bunting-health.json; then
              break
            fi
            sleep 0.25
          done
          grep -Fq '"status":"ok"' /tmp/bunting-health.json
          curl --fail --silent \
            -H 'Authorization: Bearer replace-admin-token' \
            http://127.0.0.1:8080/admin/runs/1 > /tmp/bunting-run.json
          grep -Fq '"runId":"1"' /tmp/bunting-run.json

      - name: Enforce replay and onboarding budget
        run: |
          set -euo pipefail
          started=$(date +%s)
          cargo run --locked -q -p bunting-rs --example competition_archive > /tmp/competition.archive.json
          cargo run --locked -q -p bunting-cli -- replay /tmp/competition.archive.json
          cargo run --locked -q -p bunting-cli -- score /tmp/competition.archive.json > /tmp/competition.score.json
          test $(( $(date +%s) - started )) -le 120

      - name: Verify upstream dependency
        run: cargo tree --locked -p bunting-engine | grep -F 'orderbook-rs v0.10.3'

      - name: Detect Worker-bound changes
        id: wasm-changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            worker:
              - 'apps/bunting-worker/.cargo/**'
              - 'rust-toolchain.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'apps/bunting-worker/**'
              - 'packages/**'

      - name: Check Wasm target
        if: github.event_name != 'pull_request' || steps.wasm-changes.outputs.worker == 'true'
        run: cargo check --locked --workspace --target wasm32-unknown-unknown

      - name: Smoke deployable Worker on raw Workerd
        if: github.event_name != 'pull_request' || steps.wasm-changes.outputs.worker == 'true'
        run: |
          set -euo pipefail
          cargo install worker-build --version 0.8.5 --locked
          (
            cd apps/bunting-worker
            worker-build --release --no-panic-recovery
            npx --yes workerd@1.20260716.1 serve workerd/workerd.capnp \
              > /tmp/bunting-workerd.log 2>&1 &
            workerd_pid=$!
            trap 'kill "$workerd_pid" 2>/dev/null || true' EXIT
            for attempt in $(seq 1 120); do
              if curl --fail --silent \
                http://127.0.0.1:8787/api/system.health \
                > /tmp/bunting-workerd-health.json; then
                break
              fi
              sleep 0.25
            done
            grep -Fq '"contractCompatible":true' /tmp/bunting-workerd-health.json
            status=$(curl --silent --output /tmp/bunting-workerd-fix.txt \
              --write-out '%{http_code}' \
              http://127.0.0.1:8787/fix-sessions/smoke/snapshot)
            test "$status" = 405
            grep -Fq 'publication wrapper is read-only' /tmp/bunting-workerd-fix.txt
            status=$(curl --silent --output /tmp/bunting-workerd-d1.json \
              --write-out '%{http_code}' \
              'http://127.0.0.1:8787/api/market.snapshot?input=%7B%22runId%22%3A%221%22%2C%22instrumentId%22%3A%221%22%7D')
            test "$status" = 500
            grep -Fq '"buntingCode":"ORIGIN_UNAVAILABLE"' /tmp/bunting-workerd-d1.json
          )
