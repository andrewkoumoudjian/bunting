name: GPUI market terminal

on:
  pull_request:
    paths:
      - "apps/bunting-terminal/**"
      - "apps/bunting-tui/src/lib.rs"
      - "docs/gpui-terminal-reference-inventory.md"
      - ".github/workflows/gpui-terminal.yml"
      - "Cargo.toml"
  push:
    branches:
      - "feat/gpui-market-terminal"
    paths:
      - "apps/bunting-terminal/**"
      - "apps/bunting-tui/src/lib.rs"
      - "docs/gpui-terminal-reference-inventory.md"
      - ".github/workflows/gpui-terminal.yml"
      - "Cargo.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpui-terminal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS GPUI client
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GPUI Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy

      - name: Cache Rust and GPUI sources
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/bunting-terminal/target
          key: gpui-terminal-${{ runner.os }}-${{ hashFiles('apps/bunting-terminal/Cargo.lock') }}

      - name: Verify the audited GPUI source graph
        run: |
          grep -q 'zed#1a246efd7e1b83ab568ec5e3e6c1a43a42e1abba' apps/bunting-terminal/Cargo.lock
          grep -q 'gpui-component?rev=88f102d13654fe25aa2fede076274b6b751a3704#88f102d1' apps/bunting-terminal/Cargo.lock

      - name: Check desktop client
        run: cargo +1.95.0 check --locked --manifest-path apps/bunting-terminal/Cargo.toml

      - name: Run desktop client tests
        run: cargo +1.95.0 test --locked --manifest-path apps/bunting-terminal/Cargo.toml

      - name: Lint desktop client
        run: cargo +1.95.0 clippy --locked --manifest-path apps/bunting-terminal/Cargo.toml --all-targets -- -D warnings

      - name: Check formatting
        run: cargo +1.95.0 fmt --manifest-path apps/bunting-terminal/Cargo.toml --check
