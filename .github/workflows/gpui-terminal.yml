name: GPUI market terminal

on:
  pull_request:
    paths:
      - "apps/bunting-terminal/**"
      - "apps/bunting-tui/src/lib.rs"
      - "docs/gpui-terminal-reference-inventory.md"
      - ".github/workflows/gpui-terminal.yml"
      - "Cargo.toml"
  push:
    branches:
      - "feat/gpui-market-terminal"
    paths:
      - "apps/bunting-terminal/**"
      - "apps/bunting-tui/src/lib.rs"
      - "docs/gpui-terminal-reference-inventory.md"
      - ".github/workflows/gpui-terminal.yml"
      - "Cargo.toml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gpui-terminal-${{ github.ref }}
  cancel-in-progress: true

env:
  TERMINAL_VERSION: "0.1.0"
  TERMINAL_TAG: "bunting-terminal-v0.1.0-preview"
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  macos-arm64:
    name: Build macOS ARM64 DMG
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GPUI Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup target add aarch64-apple-darwin --toolchain 1.95.0

      - name: Cache Rust and GPUI sources
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/bunting-terminal/target
          key: gpui-terminal-arm64-${{ runner.os }}-${{ hashFiles('apps/bunting-terminal/Cargo.lock') }}

      - name: Verify the audited source graph
        run: |
          grep -q 'zed#1a246efd7e1b83ab568ec5e3e6c1a43a42e1abba' apps/bunting-terminal/Cargo.lock
          grep -q 'gpui-component?rev=88f102d13654fe25aa2fede076274b6b751a3704#88f102d1' apps/bunting-terminal/Cargo.lock

      - name: Build Apple Silicon release binary
        run: |
          cargo +1.95.0 build \
            --locked \
            --release \
            --target aarch64-apple-darwin \
            --manifest-path apps/bunting-terminal/Cargo.toml
          file apps/bunting-terminal/target/aarch64-apple-darwin/release/bunting-terminal
          lipo -archs apps/bunting-terminal/target/aarch64-apple-darwin/release/bunting-terminal | grep -q arm64

      - name: Package application and DMG
        env:
          BUNTING_TERMINAL_VERSION: ${{ env.TERMINAL_VERSION }}
          BUNTING_TERMINAL_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x apps/bunting-terminal/scripts/package-macos-arm64.sh
          apps/bunting-terminal/scripts/package-macos-arm64.sh \
            apps/bunting-terminal/target/aarch64-apple-darwin/release/bunting-terminal \
            apps/bunting-terminal/dist

      - name: Upload DMG build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bunting-Market-Terminal-macos-arm64
          path: |
            apps/bunting-terminal/dist/Bunting-Market-Terminal-v0.1.0-macos-arm64.dmg
            apps/bunting-terminal/dist/Bunting-Market-Terminal-v0.1.0-macos-arm64.dmg.sha256
          if-no-files-found: error

      - name: Publish GitHub prerelease
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-terminal]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG="apps/bunting-terminal/dist/Bunting-Market-Terminal-v0.1.0-macos-arm64.dmg"
          CHECKSUM="${DMG}.sha256"
          RELEASE_SHA="$(git rev-parse HEAD)"
          cat > release-notes.md <<EOF
          Native GPUI preview of the Bunting Market Terminal.

          - Apple Silicon only: arm64
          - Distribution: macOS DMG containing a draggable `.app`
          - Minimum macOS version: 13.0
          - Signing: ad-hoc signed; not Apple-notarized
          - Source: `${RELEASE_SHA}` on `feat/gpui-market-terminal`
          - Draft PR: #19

          Included terminal surfaces: floating/resizable internal market windows, quote chart, order book, limit/market order entry, cancellation, fills, account and positions, news, tenders, risk and score, competition controls, FIX diagnostics, and Trading/Research/Competition workspaces.

          On first launch, macOS may require Control-clicking the app and choosing **Open** because this preview is not notarized.
          EOF

          if gh release view "${TERMINAL_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TERMINAL_TAG}" "${DMG}" "${CHECKSUM}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
            gh release edit "${TERMINAL_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Bunting Market Terminal v${TERMINAL_VERSION} — macOS ARM64 Preview" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create "${TERMINAL_TAG}" "${DMG}" "${CHECKSUM}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${RELEASE_SHA}" \
              --title "Bunting Market Terminal v${TERMINAL_VERSION} — macOS ARM64 Preview" \
              --notes-file release-notes.md \
              --prerelease
          fi

      - name: Run non-gating tests
        continue-on-error: true
        run: cargo +1.95.0 test --locked --manifest-path apps/bunting-terminal/Cargo.toml

      - name: Run non-gating Clippy diagnostics
        continue-on-error: true
        run: cargo +1.95.0 clippy --locked --manifest-path apps/bunting-terminal/Cargo.toml --all-targets -- -D warnings

      - name: Run non-gating formatting diagnostics
        continue-on-error: true
        run: cargo +1.95.0 fmt --manifest-path apps/bunting-terminal/Cargo.toml --check
