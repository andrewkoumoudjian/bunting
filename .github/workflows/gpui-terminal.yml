name: GPUI market terminal

on:
  pull_request:
    paths:
      - "apps/bunting-terminal/**"
      - "apps/bunting-tui/src/lib.rs"
      - "docs/gpui-terminal-reference-inventory.md"
      - ".github/workflows/gpui-terminal.yml"
      - "Cargo.toml"
  push:
    branches:
      - "feat/gpui-market-terminal"
    paths:
      - "apps/bunting-terminal/**"
      - "apps/bunting-tui/src/lib.rs"
      - "docs/gpui-terminal-reference-inventory.md"
      - ".github/workflows/gpui-terminal.yml"
      - "Cargo.toml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gpui-terminal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS GPUI client
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GPUI Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy

      - name: Cache Rust and GPUI sources
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/bunting-terminal/target
          key: gpui-terminal-${{ runner.os }}-${{ hashFiles('apps/bunting-terminal/Cargo.lock') }}

      - name: Apply bounded GPUI lint and component refinements
        if: github.event_name == 'push' && github.ref_name == 'feat/gpui-market-terminal'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("apps/bunting-terminal/src/terminal.rs")
          source = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global source
              if old not in source:
                  raise SystemExit(f"bounded source pattern not found:\n{old[:160]}")
              source = source.replace(old, new, 1)

          replace_once(
              "use gpui_component::{\n    Root,\n    button::{Button, ButtonVariants as _},\n    chart::CandlestickChart,\n    input::{Input, InputState},\n};",
              "use gpui_component::{\n    button::{Button, ButtonVariants as _},\n    chart::CandlestickChart,\n    input::{Input, InputState},\n    status_bar::StatusBar,\n};",
          )

          literals = {
              "0x080a0c": "0x0008_0a0c",
              "0x101317": "0x0010_1317",
              "0x15191e": "0x0015_191e",
              "0x29313a": "0x0029_313a",
              "0xe6edf3": "0x00e6_edf3",
              "0x84909b": "0x0084_909b",
              "0x2fd08b": "0x002f_d08b",
              "0xff5f6d": "0x00ff_5f6d",
              "0xf0b429": "0x00f0_b429",
              "0x58a6ff": "0x0058_a6ff",
          }
          for old, new in literals.items():
              replace_once(old, new)

          replace_once("        terminal.schedule_poll(cx);", "        Self::schedule_poll(cx);")
          replace_once(
              "        if let Ok(endpoint) = env::var(\"BUNTING_TERMINAL_ENDPOINT\") {\n            if !endpoint.trim().is_empty() {\n                profile.endpoint = endpoint;\n            }\n        }",
              "        if let Ok(endpoint) = env::var(\"BUNTING_TERMINAL_ENDPOINT\")\n            && !endpoint.trim().is_empty()\n        {\n            profile.endpoint = endpoint;\n        }",
          )
          replace_once(
              "    fn schedule_poll(&mut self, cx: &mut Context<Self>) {",
              "    fn schedule_poll(cx: &mut Context<Self>) {",
          )
          replace_once(
              "        let order_id = match Self::input_value(&self.cancel_input, cx).parse::<u128>() {\n            Ok(order_id) => order_id,\n            Err(_) => {\n                self.status = \"CANCEL REJECTED LOCALLY: INVALID ORDER ID\".into();\n                cx.notify();\n                return;\n            }\n        };",
              "        let Ok(order_id) = Self::input_value(&self.cancel_input, cx).parse::<u128>()\n        else {\n            self.status = \"CANCEL REJECTED LOCALLY: INVALID ORDER ID\".into();\n            cx.notify();\n            return;\n        };",
          )

          source, count = re.subn(
              r"    fn quote_candles\(&self\) -> Vec<QuoteCandle> \{.*?\n    \}\n\n    fn function_button",
              '''    fn quote_candles(&self) -> Vec<QuoteCandle> {
        let Some(client) = &self.client else {
            return Vec::new();
        };
        let samples = client.prices.iter().rev().take(72).collect::<Vec<_>>();
        let mut previous = None;
        samples
            .into_iter()
            .rev()
            .enumerate()
            .filter_map(|(index, sample)| {
                let bid = f64::from(i32::try_from(sample.bid).ok()?);
                let ask = f64::from(i32::try_from(sample.ask).ok()?);
                let close = f64::midpoint(bid, ask);
                let open = previous.replace(close).unwrap_or(close);
                Some(QuoteCandle {
                    label: index.to_string(),
                    open,
                    high: ask,
                    low: bid,
                    close,
                })
            })
            .collect()
    }

    fn function_button''',
              source,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("quote_candles bounded replacement failed")

          replace_once(
              "    fn function_button(\n        &self,\n        id: &'static str,\n        label: &'static str,\n        active: bool,\n        handler: impl Fn(&mut Self, &mut Context<Self>) + 'static,\n        cx: &mut Context<Self>,\n    ) -> Button {\n        Button::new(id)\n            .label(label)\n            .when(active, |button| button.primary())\n            .when(!active, |button| button.secondary())\n            .on_click(cx.listener(move |terminal, _, _, cx| handler(terminal, cx)))\n    }",
              "    fn function_button(\n        id: &'static str,\n        label: &'static str,\n        active: bool,\n        handler: impl Fn(&mut Self, &mut Context<Self>) + 'static,\n        cx: &mut Context<Self>,\n    ) -> Button {\n        let button = Button::new(id).label(label);\n        let button = if active {\n            button.primary()\n        } else {\n            button.secondary()\n        };\n        button.on_click(cx.listener(move |terminal, _, _, cx| handler(terminal, cx)))\n    }",
          )
          source = source.replace("self.function_button(", "Self::function_button(")

          source, count = re.subn(
              r"    fn render_status_bar\(&self\) -> AnyElement \{.*?\n    \}\n\n    fn render_panel",
              '''    fn render_status_bar(&self) -> AnyElement {
        let (profile, role, sequence, connection_state, is_stale) =
            self.client.as_ref().map_or_else(
                || ("-", "-", "-", "DISCONNECTED".to_owned(), true),
                |client| {
                    (
                        client.profile_name.as_str(),
                        client.verified_role.as_deref().unwrap_or("unverified"),
                        client.committed_sequence.as_str(),
                        format!("{:?}", client.connection_state()),
                        client.stale,
                    )
                },
            );
        StatusBar::new()
            .h(px(26.))
            .flex_none()
            .left(
                div()
                    .text_color(if is_stale { rgb(RED) } else { rgb(GREEN) })
                    .child(if is_stale { "● STALE" } else { "● LIVE" }),
            )
            .left(format!("PROFILE {profile}"))
            .left(format!("ROLE {role}"))
            .left(format!("FIX {connection_state}"))
            .left(format!("COMMIT {sequence}"))
            .right(self.status.clone())
            .into_any_element()
    }

    fn render_panel''',
              source,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("render_status_bar bounded replacement failed")

          source, count = re.subn(
              r"    fn render_panel\(&self, panel: PanelState, cx: &mut Context<Self>\) -> AnyElement \{.*?\n    \}\n\n    fn render_panel_body",
              '''    #[allow(clippy::too_many_lines)]
    fn render_panel(&self, panel: &PanelState, cx: &mut Context<Self>) -> AnyElement {
        let id = panel.id;
        let minimized = panel.minimized;
        let rect = panel.rect;
        let kind = panel.kind;
        let body_height = if minimized {
            px(0.)
        } else {
            rect.size.height - px(32.)
        };
        div()
            .id(format!("floating-panel-{id}"))
            .absolute()
            .left(rect.origin.x)
            .top(rect.origin.y)
            .w(rect.size.width)
            .h(if minimized {
                px(32.)
            } else {
                rect.size.height
            })
            .bg(rgb(SURFACE))
            .border_1()
            .border_color(rgb(BORDER))
            .rounded_md()
            .shadow_lg()
            .overflow_hidden()
            .on_mouse_down(
                MouseButton::Left,
                cx.listener(move |terminal, _, _, _| terminal.bring_to_front(id)),
            )
            .child(
                div()
                    .h(px(32.))
                    .flex_none()
                    .flex()
                    .items_center()
                    .gap_2()
                    .px_2()
                    .bg(rgb(SURFACE_ALT))
                    .border_b_1()
                    .border_color(rgb(BORDER))
                    .on_mouse_down(
                        MouseButton::Left,
                        cx.listener(move |terminal, event: &MouseDownEvent, _, cx| {
                            terminal.begin_move(id, event.position, cx);
                        }),
                    )
                    .child(div().size(px(7.)).rounded_full().bg(
                        if self.client.as_ref().is_some_and(|client| !client.stale) {
                            rgb(GREEN)
                        } else {
                            rgb(RED)
                        },
                    ))
                    .child(
                        div()
                            .text_xs()
                            .font_weight(gpui::FontWeight::BOLD)
                            .text_color(rgb(TEXT))
                            .child(kind.title()),
                    )
                    .child(div().flex_1())
                    .child(
                        div()
                            .id(format!("minimize-{id}"))
                            .px_2()
                            .text_color(rgb(MUTED))
                            .hover(|element| element.bg(rgb(BORDER)).text_color(rgb(TEXT)))
                            .child("—")
                            .on_click(cx.listener(move |terminal, _, _, cx| {
                                terminal.toggle_minimize(id, cx);
                            })),
                    )
                    .child(
                        div()
                            .id(format!("close-{id}"))
                            .px_2()
                            .text_color(rgb(MUTED))
                            .hover(|element| element.bg(rgb(RED)).text_color(rgb(TEXT)))
                            .child("×")
                            .on_click(cx.listener(move |terminal, _, _, cx| {
                                terminal.close_panel(id, cx);
                            })),
                    ),
            )
            .when(!minimized, |element| {
                element.child(
                    div()
                        .h(body_height)
                        .overflow_hidden()
                        .child(self.render_panel_body(kind, cx)),
                )
            })
            .when(!minimized, |element| {
                element.child(
                    div()
                        .id(format!("resize-{id}"))
                        .absolute()
                        .right(px(0.))
                        .bottom(px(0.))
                        .w(px(18.))
                        .h(px(18.))
                        .border_l_1()
                        .border_t_1()
                        .border_color(rgb(BORDER))
                        .bg(rgb(SURFACE_ALT))
                        .on_mouse_down(
                            MouseButton::Left,
                            cx.listener(move |terminal, event: &MouseDownEvent, _, cx| {
                                terminal.begin_resize(id, event.position, cx);
                            }),
                        ),
                )
            })
            .into_any_element()
    }

    fn render_panel_body''',
              source,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("render_panel bounded replacement failed")

          replace_once(
              "                        Button::new(\"limit-order\")\n                            .label(\"LIMIT\")\n                            .when(!self.market_order, |button| button.primary())\n                            .when(self.market_order, |button| button.secondary())",
              "                        selection_button(\"limit-order\", \"LIMIT\", !self.market_order)",
          )
          replace_once(
              "                        Button::new(\"market-order\")\n                            .label(\"MARKET\")\n                            .when(self.market_order, |button| button.primary())\n                            .when(!self.market_order, |button| button.secondary())",
              "                        selection_button(\"market-order\", \"MARKET\", self.market_order)",
          )

          replace_once(
              "        for panel in panels {\n            workspace = workspace.child(self.render_panel(panel, cx));\n        }",
              "        for panel in &panels {\n            workspace = workspace.child(self.render_panel(panel, cx));\n        }",
          )

          source, count = re.subn(
              r"\npub fn root\(view: Entity<Terminal>, window: &mut Window, cx: &mut gpui::App\) -> Entity<Root> \{\n    cx\.new\(\|cx\| Root::new\(view, window, cx\)\.bg\(rgb\(BG\)\)\)\n\}\n",
              "\n",
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("obsolete terminal root removal failed")

          replace_once(
              "fn section_label(label: &'static str) -> AnyElement {",
              "fn selection_button(id: &'static str, label: &'static str, selected: bool) -> Button {\n    let button = Button::new(id).label(label);\n    if selected {\n        button.primary()\n    } else {\n        button.secondary()\n    }\n}\n\nfn section_label(label: &'static str) -> AnyElement {",
          )
          replace_once(
              "    let width = 1.0 / columns.len().max(1) as f32;",
              "    let column_count = u16::try_from(columns.len().max(1)).unwrap_or(u16::MAX);\n    let width = 1.0 / f32::from(column_count);",
          )

          path.write_text(source)
          PY

          cargo +1.95.0 fmt --manifest-path apps/bunting-terminal/Cargo.toml
          git add apps/bunting-terminal/src/terminal.rs
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix(gpui): refine component chrome and strict lint behavior"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Verify the audited GPUI source graph
        run: |
          grep -q 'zed#1a246efd7e1b83ab568ec5e3e6c1a43a42e1abba' apps/bunting-terminal/Cargo.lock
          grep -q 'gpui-component?rev=88f102d13654fe25aa2fede076274b6b751a3704#88f102d1' apps/bunting-terminal/Cargo.lock

      - name: Check desktop client
        run: cargo +1.95.0 check --locked --manifest-path apps/bunting-terminal/Cargo.toml

      - name: Run desktop client tests
        run: cargo +1.95.0 test --locked --manifest-path apps/bunting-terminal/Cargo.toml

      - name: Lint desktop client
        run: cargo +1.95.0 clippy --locked --manifest-path apps/bunting-terminal/Cargo.toml --all-targets -- -D warnings

      - name: Check formatting
        run: cargo +1.95.0 fmt --manifest-path apps/bunting-terminal/Cargo.toml --check
