name: Release

on:
  push:
    tags:
      - "v*"
  # A dry run on a branch: builds and bundles everything, publishes nothing.
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  native:
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 sets the glibc 2.35 floor (ADR 0044); older hosts use
          # the container image.
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            executable_suffix: ""
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            executable_suffix: ""
          - runner: macos-15
            target: aarch64-apple-darwin
            executable_suffix: ""
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            executable_suffix: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            executable_suffix: .exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - name: Install Rust target
        shell: bash
        run: rustup target add "${{ matrix.target }}"
      - name: Build unified native application
        shell: bash
        run: |
          cargo build --locked --release --target "${{ matrix.target }}" -p bunting-cli --features tui
          cargo build --locked --release --target "${{ matrix.target }}" -p bunting-trader
          cargo build --locked --release --target "${{ matrix.target }}" -p bunting-ffi -p bunting-cpp
      - name: Build stable-ABI Python wheel
        shell: bash
        run: |
          python -m pip install maturin==1.9.4
          maturin build --locked --release --target "${{ matrix.target }}" --manifest-path bindings/bunting-py/Cargo.toml --features extension-module --interpreter python3
      - name: Package native application
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME//\//-}"
          package="bunting-${tag}-${{ matrix.target }}"
          mkdir -p "stage/${package}/bin" "stage/${package}/config" dist
          cp "target/${{ matrix.target }}/release/bunting${{ matrix.executable_suffix }}" "stage/${package}/bin/"
          # Participant app over the Bunting Native Protocol (ADR 0040).
          cp "target/${{ matrix.target }}/release/bunting-trader${{ matrix.executable_suffix }}" "stage/${package}/bin/"
          # One executable; `bunting-server` and `bunting-tui` route by name.
          for alias in bunting-server bunting-tui; do
            if [ -n "${{ matrix.executable_suffix }}" ]; then
              cp "stage/${package}/bin/bunting${{ matrix.executable_suffix }}" "stage/${package}/bin/${alias}${{ matrix.executable_suffix }}"
            else
              ln -s bunting "stage/${package}/bin/${alias}"
            fi
          done
          cp apps/bunting-server/config/*.json "stage/${package}/config/"
          cp README.md PROTOCOL.md RULES.md SCORING.md RUNBOOK.md "stage/${package}/"
          mkdir -p "stage/${package}/include" "stage/${package}/lib"
          cp bindings/bunting-ffi/include/bunting.h "stage/${package}/include/"
          find "target/${{ matrix.target }}/release" -maxdepth 1 -type f \
            \( -name 'libbunting_ffi.*' -o -name 'bunting_ffi.*' -o -name 'libbunting_cpp.*' -o -name 'bunting_cpp.*' \) \
            -exec cp {} "stage/${package}/lib/" \;
          tar -C stage -czf "dist/${package}.tar.gz" "${package}"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            target/wheels/*.whl
          if-no-files-found: error

  desk:
    name: Desktop app ${{ matrix.target }}
    # Its own workspace and toolchain (ADR 0050); a separate archive so the
    # venue and terminal do not carry the GPU stack.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            executable_suffix: ""
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            executable_suffix: ""
          - runner: macos-15
            target: aarch64-apple-darwin
            executable_suffix: ""
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            executable_suffix: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            executable_suffix: .exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - name: Install Linux graphics development packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev libxcb1-dev libfontconfig-dev \
            libfreetype-dev libasound2-dev libzstd-dev
      - name: Install the app's pinned Rust toolchain and target
        working-directory: apps/bunting-desk
        shell: bash
        run: |
          rustup show
          rustup target add "${{ matrix.target }}"
      - name: Build the desktop app
        working-directory: apps/bunting-desk
        shell: bash
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Package the desktop app
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME//\//-}"
          package="bunting-desk-${tag}-${{ matrix.target }}"
          mkdir -p "stage/${package}/bin" dist
          cp "apps/bunting-desk/target/${{ matrix.target }}/release/bunting-desk${{ matrix.executable_suffix }}" "stage/${package}/bin/"
          cp README.md RULES.md "stage/${package}/"
          tar -C stage -czf "dist/${package}.tar.gz" "${package}"
      - uses: actions/upload-artifact@v4
        with:
          name: desk-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  bundle:
    name: Desktop app bundles
    # Puts `bunting` beside the app in every desktop download, and builds
    # the universal macOS app and disk image (tools/bundle_desk.sh).
    needs: [native, desk]
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: archives
      - uses: actions/download-artifact@v4
        with:
          pattern: desk-*
          path: archives
      - name: Bundle the desktop app
        run: tools/bundle_desk.sh "${GITHUB_REF_NAME//\//-}" archives bundles
      - name: Install the disk image's app and open it with no arguments
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME//\//-}"
          mount=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "bundles/Bunting-${tag}-macOS.dmg"
          ditto "$mount/Bunting.app" "$HOME/Applications/Bunting.app"
          hdiutil detach "$mount"
          app="$HOME/Applications/Bunting.app"
          lipo -archs "$app/Contents/MacOS/bunting-desk"
          lipo -archs "$app/Contents/MacOS/bunting"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/bunting-desk" --version
          open "$app"
          # Opened from Finder with no flags, the app starts the practice
          # venue from the `bunting` beside it before opening its window.
          for _ in $(seq 60); do
            pgrep -fl "Bunting.app/Contents/MacOS/bunting server" && break
            sleep 1
          done
          pgrep -fl "Bunting.app/Contents/MacOS/bunting server"
          sleep 10
          screencapture -x bundles-smoke.png || true
          # Quitting the app releases its claim and the venue stops.
          pkill -TERM -f "Bunting.app/Contents/MacOS/bunting-desk"
          for _ in $(seq 30); do
            pgrep -f "Bunting.app/Contents/MacOS/bunting" >/dev/null || break
            sleep 1
          done
          if pgrep -fl "Bunting.app/Contents/MacOS/bunting"; then
            echo "the app or its venue is still running" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-smoke
          path: bundles-smoke.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: bundles/*
          if-no-files-found: error

  container:
    name: Container image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - name: Build and push image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -f apps/bunting-server/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            -t "${image}:${GITHUB_REF_NAME}" .
          docker push "${image}:${GITHUB_REF_NAME}"

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: [native, bundle, container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The venue archives, and the desktop bundles in place of the bare
      # desk archives.
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: dist
      # Native artifacts keep their `dist/` and `target/wheels/` folders, so
      # the merged download nests directories; `gh release create dist/*`
      # cannot upload a directory (v0.2.0-preview.1 failed on `dist/dist`).
      - name: Flatten downloaded artifacts
        run: |
          find dist -mindepth 2 -type f -exec mv -t dist {} +
          find dist -mindepth 1 -type d -empty -delete
      - name: Create checksums
        working-directory: dist
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          printf '%s\n' \
            '### Desktop app' \
            '' \
            'macOS or Linux, one command installs the app and the `bunting` venue:' \
            '' \
            '```bash' \
            'curl -fsSL https://raw.githubusercontent.com/andrewkoumoudjian/bunting/main/install.sh | BUNTING_VERSION='"$tag"' sh' \
            '```' \
            '' \
            '- **macOS:** the installer puts Bunting in Applications. Or download `Bunting-'"$tag"'-macOS.dmg` (Apple Silicon and Intel), open it and drag Bunting to Applications. The app is not notarized yet, so the first time, open it from System Settings → Privacy & Security → **Open Anyway** (the installer avoids this step).' \
            '- **Windows:** download `bunting-desk-'"$tag"'-x86_64-pc-windows-msvc.zip`, extract it and run `bunting-desk.exe`.' \
            '- **Linux:** the installer adds Bunting to your app launcher; the `bunting-desk` archives hold the same files.' \
            '' \
            'Opened with no options, the app starts or joins the practice market on your computer: built-in traders on two venues and eight seats, so every app you open trades in the same market. Use `--server` and your certificates for a hosted venue.' \
            '' \
            '### Venue, terminal and tools' \
            '' \
            'The same installer installs `bunting` (venue server, terminal and tools) and `bunting-trader`; set `BUNTING_DESK=0` to skip the app:' \
            '' \
            '```bash' \
            'bunting server ~/.config/bunting/server/local.json' \
            '```' \
            '' \
            'Windows: download the `bunting-'"$tag"'-x86_64-pc-windows-msvc.tar.gz` archive. Containers: `docker pull ghcr.io/andrewkoumoudjian/bunting:'"$tag"'` (configuration at `/etc/bunting/server.json`, state on `/var/lib/bunting`). Verify manual downloads with `SHA256SUMS`.' \
            '' \
            'See the repository README and docs/deployment.md for configuration and platform details.' \
            > release-notes.md
          gh release create "$tag" dist/* --verify-tag --notes-file release-notes.md --title "Bunting $tag"
