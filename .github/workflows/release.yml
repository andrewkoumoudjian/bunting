name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  wasi-server:
    name: Wasmer WASI server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: wasix-org/cargo-wasix@v0.1.28
        with:
          version: "0.1.28"
          toolchain-version: "v2026-07-07.3+rust-1.96"
          locked: "true"
      - name: Install pinned Wasmer runtime
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://get.wasmer.io |
            sh -s "v 7.2.1"
          echo "$HOME/.wasmer/bin" >> "$GITHUB_PATH"
      - name: Build and package portable WASI server
        run: |
          set -euo pipefail
          tools/build_wasi_server.sh
          tag="$GITHUB_REF_NAME"
          package="bunting-${tag}-wasi"
          mkdir -p "stage/${package}/bin" "stage/${package}/config" dist
          cp target/wasm32-wasmer-wasi-dl/release/bunting-server.wasm "stage/${package}/bin/"
          cp tools/run_wasi_server.py "stage/${package}/bin/bunting-server"
          cp apps/bunting-server/config/*.json "stage/${package}/config/"
          cp README.md PROTOCOL.md RULES.md SCORING.md RUNBOOK.md "stage/${package}/"
          tar -C stage -czf "dist/${package}.tar.gz" "${package}"
      - uses: actions/upload-artifact@v4
        with:
          name: wasi-server
          path: dist/*.tar.gz
          if-no-files-found: error

  native:
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable_suffix: ""
          - runner: macos-15
            target: aarch64-apple-darwin
            executable_suffix: ""
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            executable_suffix: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            executable_suffix: .exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - name: Install Rust target
        shell: bash
        run: rustup target add "${{ matrix.target }}"
      - name: Build unified native application
        shell: bash
        run: |
          cargo build --locked --release --target "${{ matrix.target }}" -p bunting-cli --features tui
          cargo build --locked --release --target "${{ matrix.target }}" -p bunting-ffi -p bunting-cpp
      - name: Build stable-ABI Python wheel
        shell: bash
        run: |
          python -m pip install maturin==1.9.4
          maturin build --locked --release --target "${{ matrix.target }}" --manifest-path bindings/bunting-py/Cargo.toml --features extension-module --interpreter python3
      - name: Package native application
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          package="bunting-${tag}-${{ matrix.target }}"
          mkdir -p "stage/${package}/bin" "stage/${package}/config" dist
          cp "target/${{ matrix.target }}/release/bunting${{ matrix.executable_suffix }}" "stage/${package}/bin/"
          if [ -n "${{ matrix.executable_suffix }}" ]; then
            cp "stage/${package}/bin/bunting${{ matrix.executable_suffix }}" "stage/${package}/bin/bunting-tui${{ matrix.executable_suffix }}"
          else
            ln -s bunting "stage/${package}/bin/bunting-tui"
          fi
          cp apps/bunting-server/config/*.json "stage/${package}/config/"
          cp README.md PROTOCOL.md RULES.md SCORING.md RUNBOOK.md "stage/${package}/"
          mkdir -p "stage/${package}/include" "stage/${package}/lib"
          cp bindings/bunting-ffi/include/bunting.h "stage/${package}/include/"
          find "target/${{ matrix.target }}/release" -maxdepth 1 -type f \
            \( -name 'libbunting_ffi.*' -o -name 'bunting_ffi.*' -o -name 'libbunting_cpp.*' -o -name 'bunting_cpp.*' \) \
            -exec cp {} "stage/${package}/lib/" \;
          tar -C stage -czf "dist/${package}.tar.gz" "${package}"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            target/wheels/*.whl
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [native, wasi-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          printf '%s\n' \
            'Install the Wasmer-hosted WASI server and native terminal on macOS or Linux:' \
            '' \
            '```bash' \
            'curl -fsSL https://raw.githubusercontent.com/andrewkoumoudjian/bunting/main/install.sh | BUNTING_VERSION='"$tag"' sh' \
            '```' \
            '' \
            'The installer adds the portable WASI server module and Wasmer launcher, the native `bunting` executable and `bunting-tui` alias, and server configuration templates without overwriting existing configuration. Verify manual downloads with `SHA256SUMS`.' \
            '' \
            'See the repository README for server configuration and platform details.' \
            > release-notes.md
          gh release create "$tag" dist/* --verify-tag --notes-file release-notes.md --title "Bunting $tag"
