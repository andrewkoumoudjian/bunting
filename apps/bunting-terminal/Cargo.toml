[package]
name = "bunting-terminal"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/andrewkoumoudjian/bunting"
publish = false

[workspace]

[dependencies]
bunting-tui = { path = "../bunting-tui" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "1a246efd7e1b83ab568ec5e3e6c1a43a42e1abba" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1a246efd7e1b83ab568ec5e3e6c1a43a42e1abba", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
gpui-component = "=0.5.2"
gpui-component-assets = "=0.5.1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
panic = "deny"
