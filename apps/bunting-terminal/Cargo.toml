[package]
name = "bunting-terminal"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/andrewkoumoudjian/bunting"
publish = false

[workspace]

[dependencies]
bunting-tui = { path = "../bunting-tui" }
# These URLs intentionally match gpui-component's workspace source exactly.
# Cargo.lock pins the complete Zed source graph to the audited commit.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "88f102d13654fe25aa2fede076274b6b751a3704", package = "gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "88f102d13654fe25aa2fede076274b6b751a3704", package = "gpui-component-assets" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
panic = "deny"
