[package]
name = "bunting-trading-state"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Participant trading state over the Bunting Native Protocol: books, trades, orders, account, connection and latency, shared by the terminal and desktop apps (ADR 0047)"

[dependencies]
bunting-client.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
serde_json.workspace = true

# Advisory file locks and process signals for the shared local venue
# (claims, join-or-start, last-client shutdown). Already in both lock
# files (`bunting-server` pins `=1.1.4` at the root; the desk lock has
# 1.1.5); Windows uses `std` share modes instead, so this is Unix-only.
# Recorded in `docs/reference-adoption.md`.
[target.'cfg(all(not(target_arch = "wasm32"), unix))'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[lints]
workspace = true
