[package]
name = "bunting-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
bunting-market-events.workspace = true
bunting-market-types.workspace = true
bunting-ledger = { path = "../ledger" }
bunting-risk-engine = { path = "../risk-engine" }
orderbook-rs.workspace = true
pricelevel.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# OrderBook-rs enables UUID v4 without selecting a portable entropy adapter.
# Keep the non-JS adapter explicit; wasm32-unknown-unknown uses the workspace's
# compile-only unsupported backend, while real hosts provide getrandom.
uuid = { version = "=1.23.4", features = ["rng-getrandom"] }

[lints]
workspace = true
